redpanda:
  name: redpanda-cluster
  # clusterRefName: redpanda-cluster  # Removed abstraction
  namespace: default
  labels: {}
  annotations: {}
  chartRef: {}
  clusterSpec:
    image:
      repository: redpanda/redpanda
      tag: v23.1.2
      pullPolicy: IfNotPresent
    listeners:
      kafka:
        port: 9092
        tls:
          enabled: false
      admin:
        port: 9644
        tls:
          enabled: false
      schemaRegistry:
        port: 8081
        tls:
          enabled: false
    storage:
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClass: ebs-gp3
    resources:
      requests:
        cpu: "100m"
        memory: 512Mi
      limits:
        cpu: "100m"
        memory: 512Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
# Add more fields as needed for extensibility 

# Topics management
redpandaTopics:
  enabled: true
  topics:
    - name: example-topic
      partitions: 3
      replicationFactor: 3
      cluster:
        clusterRef:
          name: redpanda-cluster
      config: {}
      extraSpec: {}
  # Add more topics as needed 